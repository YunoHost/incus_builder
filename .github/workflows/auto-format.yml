name: Auto format with Ruff and shfmt

on:
  push:
    branches: [main]

jobs:
  format:
    name: Auto format with Ruff and shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Ruff on Python files
        uses: astral-sh/ruff-action@v3
        with:
          args: "format"

      - name: Run Shfmt on Bash files
        uses: collin-miller/shfmt-action@v1
        with:
          # -i=4    # indent
          # -kp     # keep column alignment paddings
          # -sr     # redirect operators will be followed by a space
          # -bn     # binary ops like && and | may start a line
          # -ci     # switch cases will be indented
          # -w      # write to file instead of stdout
          args: -i=4 -kp -sr -bn -ci -w .
        continue-on-error: true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit-message: >
            :art: Format code with [ruff](https://docs.astral.sh/ruff/)
            and [shfmt](https://github.com/patrickvane/shfmt).
