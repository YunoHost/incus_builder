name: Run Python and Bash linting

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Run Mypy
      uses: jpetrucciani/mypy-check@master
      with:
        mypy_flags: --install-types --non-interactive
        path: '.'

    - name: Run Ruff on Python files
      uses: astral-sh/ruff-action@v3
      with:
        args: "format"

  bash-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@master
      env:
        SHELLCHECK_OPTS: -x
      with:
        additional_files: recipes
